# Local CI lab: Jenkins (CI server) + SonarQube (code quality server) on one Docker network.
# Containers reach each other by service name: Jenkins -> http://sonarqube:9000, Sonar -> http://jenkins:8080
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "8080:8080"     # Jenkins UI
      - "50000:50000"   # inbound agents (not used yet)
    volumes:
      - jenkins_home:/var/jenkins_home   # jobs, plugins, creds, ~/.m2 cache survive restarts
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"   # local only; skips Elasticsearch kernel checks
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
